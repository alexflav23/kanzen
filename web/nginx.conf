server {
  listen 23020;
  server_name _;
  root /usr/share/nginx/html;

  # Fingerprinted build assets are content-hashed → safe to cache hard + forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The SPA shell (index.html, served at "/" and as the client-routing fallback for every path)
  # must ALWAYS revalidate — otherwise a browser holds an old shell that points at stale bundles,
  # and a new deploy looks like nothing changed. no-cache forces a conditional GET each load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
