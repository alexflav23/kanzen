kanzen {
  env = "local"
  env = ${?KANZEN_ENV}
  port = 8080
  port = ${?PORT}
  admin-port = 9990
  admin-port = ${?ADMIN_PORT}
  metrics-port = 9464
  metrics-port = ${?METRICS_PORT}
  # The base URL the browser uses to reach this API (for signed blob/download URLs).
  public-base-url = "http://localhost:8080"
  public-base-url = ${?PUBLIC_BASE_URL}
  # HMAC secret for signed /api/blobs URLs — stable across restarts (prod: inject from Secrets Manager).
  blob-secret = "kanzen-dev-blob-secret"
  blob-secret = ${?BLOB_SECRET}
  # F05 object store. endpoint set ⇒ LocalStack/custom (dev); empty ⇒ real AWS S3 (prod).
  s3 {
    bucket = "kanzen-documents"
    bucket = ${?S3_BUCKET}
    endpoint = "http://localstack:4566"
    endpoint = ${?S3_ENDPOINT}
    region = "us-east-1"
    region = ${?S3_REGION}
    access-key = "test"
    access-key = ${?S3_ACCESS_KEY}
    secret-key = "test"
    secret-key = ${?S3_SECRET_KEY}
  }
  db {
    url = "jdbc:postgresql://localhost:5432/kanzen"
    url = ${?DATABASE_URL}
    user = "kanzen"
    user = ${?DB_USER}
    password = "kanzen"
    password = ${?DB_PASSWORD}
  }
}
