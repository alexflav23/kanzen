# Kanzen local dev stack (F00). Postgres + LocalStack.
# The general ledger lives in Postgres (ADR-001, specs/02-accounting-ledger-architecture.md) —
# TigerBeetle was dropped: a family-office GL is Postgres-shaped, not exchange-grade infra.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kanzen
      POSTGRES_PASSWORD: kanzen
      POSTGRES_DB: kanzen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanzen"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"

volumes:
  pgdata:
