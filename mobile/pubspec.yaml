name: kanzen_mobile
description: Kanzen companion app (F31) — capture-first mobile.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Real backend client (F31): the companion talks to the same /api as the web app.
  http: ^1.2.0
  # Local persistence of the Cognito/dev JWT across launches.
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
